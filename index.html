<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Métodos Kwai</title>
  <style>
    :root {
      --bg-dark: #0f1115;          /* Preto carvão elegante */
      --bg-card: #181c24;          /* Cinza escuro para os blocos */
      --bg-input: #101217;         /* Preto fosco para inputs */
      --accent: #ff0055;           /* Rosa choque padrão */
      --accent-neon: #00f0ff;      /* Azul neon de destaque */
      --text-main: #f1f5f9;        /* Texto principal claro */
      --text-muted: #8b949e;       /* Cinza claro secundário */
      --border-color: #2b313b;     /* Borda sutil cinza */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      padding: 15px; 
      padding-bottom: 90px; 
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px rgba(255,0,85,0.4); }
    header p { color: var(--text-muted); font-size: 0.85rem; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-neon);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Carrossel */
    .carousel-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
    }
    .carousel-item {
      flex: 0 0 280px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .carousel-item h3 { font-size: 0.95rem; color: #fff; margin-bottom: 6px; }
    .carousel-item p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; }
    
    /* Formulários */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, textarea, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent-neon); }
    textarea { resize: vertical; min-height: 70px; }

    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .mode-btn.active { background: var(--accent); color: #fff; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #b3003b);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 2px 10px rgba(255, 0, 85, 0.3);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent-neon);
      color: var(--accent-neon);
      margin-top: 5px;
      box-shadow: none;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .status-green { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid #00ff88; }
    .status-red { background: rgba(255, 0, 85, 0.15); color: #ff0055; border: 1px solid #ff0055; }
    .status-none { background: rgba(255,255,255,0.05); color: var(--text-muted); }

    /* Preview da imagem carregada */
    .preview-container {
      margin-top: 10px;
      text-align: center;
    }
    .preview-container img {
      max-width: 100%;
      max-height: 150px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: none;
    }

    /* Barra Inferior com Ícones */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #12151c;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.70rem;
      cursor: pointer;
      gap: 4px;
      flex: 1;
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .nav-item.active {
      color: var(--accent-neon);
    }

    .hidden { display: none; }
    .counter { font-size: 0.75rem; color: var(--accent-neon); margin-top: 3px; }
  </style>
</head>
<body>

  <header>
    <h1>PAINEL DE MÉTODOS KWAI</h1>
    <p>Gerenciador de Automação & Análise OpenAI Vision</p>
  </header>

  <!-- ABA 1: TICKETS -->
  <div id="tab-tickets" class="tab-content active">
    <div class="card">
      <h2>🎫 Textos para Tickets (Direto no Kwai)</h2>
      <div class="form-group" style="margin-bottom: 15px;">
        <label>ID da Pessoa Denunciada (Opcional para incluir ao copiar):</label>
        <input type="text" id="idAlvoTicket" placeholder="Ex: 987654321">
      </div>
      <div class="carousel-container" id="carouselTickets"></div>
    </div>
  </div>

  <!-- ABA 2: E-MAILS -->
  <div id="tab-emails" class="tab-content">
    <div class="card">
      <h2>✉️ Textos para E-mail</h2>
      <div class="carousel-container" id="carouselEmails"></div>
    </div>
  </div>

  <!-- ABA 3: ANÁLISE DE PERFIL COM OPENAI -->
  <div id="tab-analise" class="tab-content">
    <div class="card">
      <h2>🔍 Análise Inteligente (OpenAI Vision)</h2>
      
      <div class="form-group">
        <label>Chave da API OpenAI:</label>
        <input type="password" id="apiKeyInput" value="Sk-proj-0zQQBiCh3QYDZBivHL_RMKg00ON94nWQV99_N250lXKzBp2QKR6tSYrXYEHO9_IEOBhU0andsZT3BlbkFJvOpatBKanSStGNvtrBNfjASOs_Xg1Ray1SWyESHV4oPRh2TZUj8hRljzs4FerDZsN3k358L3oA">
      </div>

      <div class="form-group">
        <label>Selecionar Print (Perfil, Vídeo ou Mensagem):</label>
        <input type="file" id="mediaInput" accept="image/*" onchange="mostrarPreview(event)">
      </div>
      
      <div class="preview-container">
        <img id="imagePreview" alt="Preview da Mídia">
      </div>

      <button class="btn" style="margin-top: 12px;" onclick="analisarComOpenAI()">Analisar com IA (OpenAI)</button>
      
      <div id="statusArea" class="status-badge status-none">Aguardando envio de arquivo...</div>
      <p id="analysisDetail" style="font-size: 0.8rem; margin-top: 8px; color: var(--text-muted);"></p>
    </div>
  </div>

  <!-- ABA 4: CENTRAL DE ENVIO -->
  <div id="tab-envio" class="tab-content">
    <div class="card">
      <h2>🚀 Central de Envio de E-mail</h2>

      <div class="form-group">
        <label>ID da Pessoa Denunciada (Alvo):</label>
        <input type="text" id="idAlvo" placeholder="Ex: 987654321">
      </div>
      <div class="form-group">
        <label>Seu ID Kwai (Denunciante):</label>
        <input type="text" id="meuId" placeholder="Ex: 15000987654">
      </div>

      <div class="mode-switch">
        <button class="mode-btn active" id="btnManual" onclick="mudarModo('manual')">Manual</button>
        <button class="mode-btn" id="btnAuto" onclick="mudarModo('auto')">Automático</button>
      </div>

      <div id="modoManual">
        <div class="form-group">
          <label>Para (E-mail destino):</label>
          <input type="email" id="paraManual" placeholder="suporte@kwai.com">
        </div>
        <div class="form-group">
          <label>Assunto:</label>
          <input type="text" id="assuntoManual" placeholder="Assunto da mensagem">
        </div>
        <div class="form-group">
          <label>Mensagem:</label>
          <textarea id="mensagemManual" placeholder="Texto preenchido..."></textarea>
        </div>
        <button class="btn" onclick="enviarManual()">Enviar E-mail</button>
      </div>

      <div id="modoAuto" class="hidden">
        <div class="form-group">
          <label>Lista de E-mails Destino (um por linha):</label>
          <textarea id="listaEmails" placeholder="suporte1@kwai.com&#10;suporte2@kwai.com"></textarea>
        </div>
        <div class="form-group">
          <label>Senhas de App carregadas (uma por linha):</label>
          <textarea id="senhasApp" oninput="atualizarContadorSenhas()" placeholder="senha_app_1&#10;senha_app_2"></textarea>
          <div class="counter" id="senhaCounter">Senhas de App detectadas: 0</div>
        </div>
        <div class="form-group">
          <label>Quantidade de disparos:</label>
          <input type="number" id="qtdEnviol" value="10">
        </div>
        <button class="btn" onclick="iniciarAutomacao()">Iniciar Automação</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="trocarAba('tickets', this)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      Tickets
    </button>
    <button class="nav-item" onclick="trocarAba('emails', this)">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      E-mails
    </button>
    <button class="nav-item" onclick="trocarAba('analise', this)">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Análise
    </button>
    <button class="nav-item" onclick="trocarAba('envio', this)">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      Envio
    </button>
  </nav>

  <script>
    async function carregarDados() {
      try {
        const resTickets = await fetch('tickets.json');
        const dataTickets = await resTickets.json();
        renderizarCarouselTickets('carouselTickets', dataTickets);

        const resEmails = await fetch('emails.json');
        const dataEmails = await resEmails.json();
        renderizarCarouselEmails('carouselEmails', dataEmails);
      } catch (err) {
        console.error("Erro ao carregar os arquivos JSON:", err);
      }
    }

    function renderizarCarouselTickets(elementId, banco) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      banco.categorias.forEach(cat => {
        cat.itens.forEach(item => {
          const div = document.createElement('div');
          div.className = 'carousel-item';
          div.innerHTML = `
            <div>
              <h3>${item.titulo}</h3>
              <p>${item.mensagem}</p>
            </div>
            <button class="btn btn-secondary" onclick="copiarTicket(\`${item.mensagem}\`, this)">Copiar para o Kwai</button>
          `;
          container.appendChild(div);
        });
      });
    }

    function renderizarCarouselEmails(elementId, banco) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      banco.categorias.forEach(cat => {
        cat.itens.forEach(item => {
          const div = document.createElement('div');
          div.className = 'carousel-item';
          div.innerHTML = `
            <div>
              <h3>${item.titulo}</h3>
              <p>${item.mensagem}</p>
            </div>
            <button class="btn btn-secondary" onclick="usarEmail(\`${item.assunto || ''}\`, \`${item.mensagem}\`)">Usar no Envio</button>
          `;
          container.appendChild(div);
        });
      });
    }

    function copiarTicket(mensagemBase, botao) {
      const idAlvo = document.getElementById('idAlvoTicket').value.trim();
      const textoFinal = idAlvo ? `${mensagemBase} ${idAlvo}` : mensagemBase;

      navigator.clipboard.writeText(textoFinal).then(() => {
        const originalText = botao.innerText;
        botao.innerText = 'Copiado!';
        botao.style.borderColor = '#00ff88';
        botao.style.color = '#00ff88';
        setTimeout(() => {
          botao.innerText = originalText;
          botao.style.borderColor = '';
          botao.style.color = '';
        }, 2000);
      });
    }

    function usarEmail(assunto, mensagem) {
      const idAlvo = document.getElementById('idAlvo').value || '[ID_ALVO]';
      const meuId = document.getElementById('meuId').value || '[MEU_ID]';
      
      const msgFormatada = mensagem.replace(/{ID_ALVO}/g, idAlvo).replace(/{MEU_ID}/g, meuId);
      const assuntoFormatado = assunto.replace(/{ID_ALVO}/g, idAlvo).replace(/{MEU_ID}/g, meuId);

      document.getElementById('assuntoManual').value = assuntoFormatado;
      document.getElementById('mensagemManual').value = msgFormatada;
      trocarAba('envio', document.querySelectorAll('.nav-item')[3]);
    }

    function trocarAba(abaId, elementoBtn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + abaId).classList.add('active');
      elementoBtn.classList.add('active');
    }

    function mostrarPreview(event) {
      const reader = new FileReader();
      reader.onload = function(){
        const output = document.getElementById('imagePreview');
        output.src = reader.result;
        output.style.display = 'block';
      };
      reader.readAsDataURL(event.target.files[0]);
    }

    // ANÁLISE REAL COM A API VISION DA OPENAI
    async function analisarComOpenAI() {
      const input = document.getElementById('mediaInput');
      const statusArea = document.getElementById('statusArea');
      const detail = document.getElementById('analysisDetail');
      const previewImg = document.getElementById('imagePreview');
      const apiKey = document.getElementById('apiKeyInput').value.trim();

      if (!input.files || input.files.length === 0) {
        alert('Por favor, selecione uma imagem primeiro.');
        return;
      }

      if (!apiKey) {
        alert('Por favor, insira uma chave de API válida.');
        return;
      }

      statusArea.className = 'status-badge status-none';
      statusArea.innerText = 'Enviando imagem para IA analisar...';
      detail.innerText = 'Aguardando resposta da OpenAI Vision API...';

      const base64Image = previewImg.src;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              {
                role: "user",
                content: [
                  {
                    type: "text",
                    text: "Analise este print/imagem com foco em violações de diretrizes de redes sociais (como menor de idade sem supervisão, conteúdo inapropriado, spam ou violações graves). Responda de forma direta no seguinte formato:\nSTATUS: [VERMELHO ou VERDE]\nMOTIVO: [Explicação curta e direta do que foi encontrado]"
                  },
                  {
                    type: "image_url",
                    image_url: {
                      url: base64Image
                    }
                  }
                ]
              }
            ],
            max_tokens: 150
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const respostaIA = data.choices[0].message.content;

        if (respostaIA.includes("VERMELHO")) {
          statusArea.className = 'status-badge status-red';
          statusArea.innerText = '🔴 Status Vermelho: Violação Detectada';
        } else {
          statusArea.className = 'status-badge status-green';
          statusArea.innerText = '🟢 Status Verde: Conta / Conteúdo Regular';
        }

        detail.innerText = respostaIA;

      } catch (error) {
        statusArea.className = 'status-badge status-red';
        statusArea.innerText = '⚠️ Erro na Análise';
        detail.innerText = 'Erro ao conectar com a API da OpenAI: ' + error.message;
      }
    }

    function mudarModo(modo) {
      if (modo === 'manual') {
        document.getElementById('modoManual').classList.remove('hidden');
        document.getElementById('modoAuto').classList.add('hidden');
        document.getElementById('btnManual').classList.add('active');
        document.getElementById('btnAuto').classList.remove('active');
      } else {
        document.getElementById('modoManual').classList.add('hidden');
        document.getElementById('modoAuto').classList.remove('hidden');
        document.getElementById('btnManual').classList.remove('active');
        document.getElementById('btnAuto').classList.add('active');
      }
    }

    function atualizarContadorSenhas() {
      const senhas = document.getElementById('senhasApp').value.trim().split('\n').filter(s => s !== '');
      document.getElementById('senhaCounter').innerText = `Senhas de App detectadas: ${senhas.length}`;
    }

    function enviarManual() {
      alert('Comando de envio manual acionado!');
    }

    function iniciarAutomacao() {
      const idAlvo = document.getElementById('idAlvo').value;
      const meuId = document.getElementById('meuId').value;
      if (!idAlvo || !meuId) {
        alert('Por favor, preencha o ID da pessoa denunciada e o seu ID!');
        return;
      }
      alert('Iniciando disparos automáticos!');
    }

    window.onload = carregarDados;
  </script>
</body>
</html>
