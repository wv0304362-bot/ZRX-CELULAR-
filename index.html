<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Métodos Kwai</title>
  <style>
    :root {
      --bg-dark: #0f1115;          /* Preto carvão elegante */
      --bg-card: #181c24;          /* Cinza escuro para os blocos */
      --bg-input: #101217;         /* Preto fosco para inputs */
      --accent: #ff0055;           /* Rosa choque padrão */
      --accent-neon: #00f0ff;      /* Azul neon de destaque */
      --text-main: #f1f5f9;        /* Texto principal claro */
      --text-muted: #8b949e;       /* Cinza claro secundário */
      --border-color: #2b313b;     /* Borda sutil cinza */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      padding: 15px; 
      padding-bottom: 90px; /* Espaço para a barra inferior fixa */
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px rgba(255,0,85,0.4); }
    header p { color: var(--text-muted); font-size: 0.85rem; }

    /* Seções (Abas) */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-neon);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Carrossel de Categorias */
    .carousel-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
    }
    .carousel-item {
      flex: 0 0 280px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      scroll-snap-align: start;
    }
    .carousel-item h3 { font-size: 0.95rem; color: #fff; margin-bottom: 6px; }
    .carousel-item p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    
    /* Formulários & Campos */
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, textarea, select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent-neon); }
    textarea { resize: vertical; min-height: 70px; }

    /* Alternador Modo Manual/Auto */
    .mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .mode-btn.active { background: var(--accent); color: #fff; }

    /* Botões */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #b3003b);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      box-shadow: 0 2px 10px rgba(255, 0, 85, 0.3);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent-neon);
      color: var(--accent-neon);
      margin-top: 5px;
      box-shadow: none;
    }

    /* Painel Análise de Perfil */
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      margin-top: 10px;
    }
    .status-green { background: rgba(0, 255, 136, 0.15); color: #00ff88; border: 1px solid #00ff88; }
    .status-red { background: rgba(255, 0, 85, 0.15); color: #ff0055; border: 1px solid #ff0055; }
    .status-none { background: rgba(255,255,255,0.05); color: var(--text-muted); }

    /* BARRA DE NAVEGAÇÃO INFERIOR (Estilo App Nativo com Ícones) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #12151c;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }
    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      cursor: pointer;
      gap: 4px;
      flex: 1;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .nav-item.active {
      color: var(--accent-neon);
    }

    .hidden { display: none; }
    .counter { font-size: 0.75rem; color: var(--accent-neon); margin-top: 3px; }
  </style>
</head>
<body>

  <header>
    <h1>PAINEL DE MÉTODOS KWAI</h1>
    <p>Gerenciador de Automação & Análise Inteligente</p>
  </header>

  <!-- ABA 1: INÍCIO / CARROSSEL DE TEXTOS -->
  <div id="tab-home" class="tab-content active">
    <div class="card">
      <h2>📂 Categoria de Textos</h2>
      <div class="carousel-container" id="carousel">
        <!-- Renderizado via JS -->
      </div>
    </div>
  </div>

  <!-- ABA 2: ANÁLISE DE PERFIL INTELIGENTE -->
  <div id="tab-analise" class="tab-content">
    <div class="card">
      <h2>🔍 Análise de Perfil Inteligente</h2>
      <div class="form-group">
        <label>Enviar Print/Mídia (Perfil, Mensagem ou Vídeo):</label>
        <input type="file" id="mediaInput" accept="image/*">
      </div>
      <button class="btn" onclick="analisarPerfil()">Analisar Print</button>
      
      <div id="statusArea" class="status-badge status-none">Aguardando mídia para análise...</div>
      <p id="analysisDetail" style="font-size: 0.8rem; margin-top: 8px; color: var(--text-muted);"></p>
    </div>
  </div>

  <!-- ABA 3: ENVIO DE E-MAIL (MANUAL / AUTOMÁTICO) -->
  <div id="tab-email" class="tab-content">
    <div class="card">
      <h2>✉️ Envio de E-mail</h2>

      <div class="form-group">
        <label>Seu ID Kwai (Injetado nas mensagens):</label>
        <input type="text" id="meuId" placeholder="Ex: 15000987654">
      </div>

      <div class="mode-switch">
        <button class="mode-btn active" id="btnManual" onclick="mudarModo('manual')">Manual</button>
        <button class="mode-btn" id="btnAuto" onclick="mudarModo('auto')">Automático</button>
      </div>

      <!-- MODO MANUAL -->
      <div id="modoManual">
        <div class="form-group">
          <label>Para (E-mail destino):</label>
          <input type="email" id="paraManual" placeholder="suporte@kwai.com">
        </div>
        <div class="form-group">
          <label>Assunto:</label>
          <input type="text" id="assuntoManual" placeholder="Assunto da mensagem">
        </div>
        <div class="form-group">
          <label>Mensagem:</label>
          <textarea id="mensagemManual" placeholder="Texto da denúncia..."></textarea>
        </div>
        <button class="btn" onclick="enviarManual()">Enviar E-mail</button>
      </div>

      <!-- MODO AUTOMÁTICO -->
      <div id="modoAuto" class="hidden">
        <div class="form-group">
          <label>Lista de E-mails Destino (um por linha):</label>
          <textarea id="listaEmails" placeholder="exemplo1@kwai.com&#10;exemplo2@kwai.com"></textarea>
        </div>
        <div class="form-group">
          <label>Senhas de App carregadas (uma por linha):</label>
          <textarea id="senhasApp" oninput="atualizarContadorSenhas()" placeholder="senha_app_1&#10;senha_app_2"></textarea>
          <div class="counter" id="senhaCounter">Senhas de App detectadas: 0</div>
        </div>
        <div class="form-group">
          <label>Quantidade de disparos:</label>
          <input type="number" id="qtdEnviol" value="10">
        </div>
        <button class="btn" onclick="iniciarAutomacao()">Iniciar Automação</button>
      </div>
    </div>
  </div>

  <!-- BARRA DE NAVEGAÇÃO INFERIOR COM ÍCONES -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="trocarAba('home', this)">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Início
    </button>
    <button class="nav-item" onclick="trocarAba('analise', this)">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Análise
    </button>
    <button class="nav-item" onclick="trocarAba('email', this)">
      <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      E-mail
    </button>
  </nav>

  <script>
    let bancoDados = { categorias: [] };

    // Alternar Abas da Barra Inferior
    function trocarAba(abaId, elementoBtn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

      document.getElementById('tab-' + abaId).classList.add('active');
      elementoBtn.classList.add('active');
    }

    // Carregar JSON do GitHub
    async function carregarConteudo() {
      try {
        const res = await fetch('conteudo.json');
        bancoDados = await res.json();
        renderizarCarrossel();
      } catch (err) {
        console.error("Erro ao carregar o arquivo conteudo.json:", err);
      }
    }

    function renderizarCarrossel() {
      const carousel = document.getElementById('carousel');
      carousel.innerHTML = '';

      bancoDados.categorias.forEach(cat => {
        cat.itens.forEach(item => {
          const div = document.createElement('div');
          div.className = 'carousel-item';
          div.innerHTML = `
            <h3>${item.titulo}</h3>
            <p>${item.mensagem}</p>
            <button class="btn btn-secondary" onclick="usarTextoNoEmail('${item.assunto}', \`${item.mensagem}\`)">Usar no Envio</button>
          `;
          carousel.appendChild(div);
        });
      });
    }

    // Enviar texto direto para a aba de e-mail e alternar para ela
    function usarTextoNoEmail(assunto, mensagem) {
      const meuId = document.getElementById('meuId').value || '[ SEU ID AQUI ]';
      const msgFormatada = mensagem.replace('{MEU_ID}', meuId);
      
      document.getElementById('assuntoManual').value = assunto;
      document.getElementById('mensagemManual').value = msgFormatada;

      // Troca automática para a aba de e-mail e aciona o botão correspondente na navbar
      trocarAba('email', document.querySelectorAll('.nav-item')[2]);
    }

    // Modos Manual e Auto
    function mudarModo(modo) {
      if (modo === 'manual') {
        document.getElementById('modoManual').classList.remove('hidden');
        document.getElementById('modoAuto').classList.add('hidden');
        document.getElementById('btnManual').classList.add('active');
        document.getElementById('btnAuto').classList.remove('active');
      } else {
        document.getElementById('modoManual').classList.add('hidden');
        document.getElementById('modoAuto').classList.remove('hidden');
        document.getElementById('btnManual').classList.remove('active');
        document.getElementById('btnAuto').classList.add('active');
      }
    }

    function atualizarContadorSenhas() {
      const senhas = document.getElementById('senhasApp').value.trim().split('\n').filter(s => s !== '');
      document.getElementById('senhaCounter').innerText = `Senhas de App detectadas: ${senhas.length}`;
    }

    // Análise de Perfil Simulada
    function analisarPerfil() {
      const input = document.getElementById('mediaInput');
      const statusArea = document.getElementById('statusArea');
      const detail = document.getElementById('analysisDetail');

      if (!input.files || input.files.length === 0) {
        alert('Por favor, selecione uma foto ou print primeiro.');
        return;
      }

      statusArea.className = 'status-badge status-none';
      statusArea.innerText = 'Analisando imagem...';

      setTimeout(() => {
        const isViolacao = Math.random() > 0.5;
        if (isViolacao) {
          statusArea.className = 'status-badge status-red';
          statusArea.innerText = '🔴 Status Vermelho: Violação Detectada';
          detail.innerText = 'Motivo: Suspeita de menor de idade ou descumprimento de termos gerais. Recomendado enviar denúncia.';
        } else {
          statusArea.className = 'status-badge status-green';
          statusArea.innerText = '🟢 Status Verde: Conta em Regularidade';
          detail.innerText = 'Nenhuma violação grave detectada nos parâmetros visuais fornecidos.';
        }
      }, 1500);
    }

    function enviarManual() {
      alert('Comando de envio manual acionado!');
    }

    function iniciarAutomacao() {
      const id = document.getElementById('meuId').value;
      if (!id) {
        alert('Por favor, insira seu ID do Kwai antes de iniciar!');
        return;
      }
      alert('Iniciando disparos automáticos alternando categorias!');
    }

    window.onload = carregarConteudo;
  </script>
</body>
</html>
